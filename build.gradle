plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
    id 'maven-publish'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // JEI
    compileOnly "mezz.jei:jei-26.3-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-26.3-fabric-api:${project.jei_version}"
    runtimeOnly "mezz.jei:jei-26.3-fabric:${project.jei_version}"

    // Mod Menu
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${base.archivesName.get()}-${project.version}-${project.mod_loader}-${project.minecraft_version}.jar"
}

loom {
    runs {
        client {
            client()
            name "Fabric Client"
        }
        server {
            server()
            name "Fabric Server"
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_version_range", project.minecraft_version_range
    inputs.property "loader_version", project.loader_version
    inputs.property "mod_id", project.mod_id
    inputs.property "mod_name", project.mod_name
    inputs.property "mod_license", project.mod_license
    inputs.property "mod_authors", project.mod_authors
    inputs.property "mod_description", project.mod_description

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "mod_version": project.version,
                "minecraft_version": project.minecraft_version,
                "minecraft_version_range": project.minecraft_version_range,
                "loader_version": project.loader_version,
                "mod_id": project.mod_id,
                "mod_name": project.mod_name,
                "mod_license": project.mod_license,
                "mod_authors": project.mod_authors,
                "mod_description": project.mod_description
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
